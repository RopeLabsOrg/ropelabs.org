name: Build and Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'docs/**'
      - 'scripts/**'
      - 'smb.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  pages:
    uses: Pezmc/simple-markdown-builder/.github/workflows/pages.yml@v3.1.0
