<!doctype html>
<html lang="{{LANG}}" class="h-full">
  <head>
    {{> partials/head.html}}
  </head>
  <body class="min-h-full text-ink">
    <div class="relative isolate overflow-hidden">
      <div class="mx-auto max-w-4xl px-6 py-16 lg:px-10">
        <div class="flex flex-col items-center text-center mb-12">
          <img
            src="/img/logo_small.png"
            alt="RopeLabs logo"
            class="mb-6 h-24 w-24"
          />
          <h1 class="text-5xl font-bold text-ink mb-4">{{TITLE}}</h1>
          <p class="text-xl text-muted max-w-2xl">{{DESCRIPTION}}</p>
        </div>
        <div
          class="prose prose-lg prose-slate max-w-none mx-auto prose-a:text-secondary hover:prose-a:text-primary prose-strong:text-ink prose-headings:text-ink prose-headings:font-semibold"
        >
          {{BODY}}
        </div>
      </div>
      <footer class="border-t border-primary/10 bg-ink text-white mt-16">
        <div
          class="mx-auto flex max-w-4xl flex-wrap items-center justify-center gap-4 px-6 py-6 text-sm"
        >
          {{> partials/footer-contact.html}}
        </div>
      </footer>
    </div>
    {{> partials/scripts.html}}
  </body>
</html>
